name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://pingwatch:ci-only@127.0.0.1:5432/pingwatch
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pingwatch
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: pingwatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pingwatch -d pingwatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest
