[project]
name = "pingwatch"
version = "0.1.0"
description = "Self-hosted website uptime monitor with Telegram alerts"
readme = "README.md"
authors = [
    { name = "redgi", email = "sasharusyn2004@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
pingwatch = "pingwatch:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
